[project]
name = "idat"
version = "0.1.0"
description = ""
readme = "README.md"
license = { text = "Not open source" }
authors = [
  { name = "Luis Glaser", email = "l.glaser@comprensio.ai" },
  { name = "Nico Pfiffner", email = "nico@pfiffner-researchit.com" },
]
requires-python = "==3.14.*"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "argon2-cffi==25.1.0",
  "crispy-bootstrap5==2026.9",
  "django==6.0.8",
  "django-allauth[mfa]==65.19.7",
  "django-anymail==15.2",
  "django-cors-headers==4.9.0",
  "django-crispy-forms==2.7",
  "django-environ==0.14.0",
  "django-model-utils==5.0.0",
  "django-ninja==1.7.1",
  "django-redis==7.0.0",
  "gunicorn==26.2.0",
  "hiredis==3.4.2",
  "pillow==12.3.0",
  "psycopg[c]==3.3.6",
  "pycountry>=26.2.16",
  "python-slugify==9.1.2",
  "redis==8.1.0",
  "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
  "coverage==7.16.2",
  "django-coverage-plugin==3.2.2",
  "django-debug-toolbar==8.0.0",
  "django-extensions==4.1",
  "django-stubs[compatible-mypy]==6.1.2",
  "django-upgrade==1.33.0",
  "djangofmt>=1.1.0",
  "djlint==1.46.4",
  "factory-boy==3.3.3",
  "ipdb==0.13.13",
  "mypy==2.4.0",
  "pre-commit==4.6.2",
  "psycopg[c]==3.3.6",
  "pytest==9.1.1",
  "pytest-django==4.14.0",
  "pytest-sugar==1.1.1",
  "ruff==0.16.10",
  "sphinx==9.1.0",
  "sphinx-autobuild==2025.8.25",
  "werkzeug[watchdog]==3.1.9",
]

# ==== djLint ====
[tool.djlint]
profile = "django"
include = "H017,H035"
custom_blocks = "element,slot"
# TODO: remove T002 when fixed https://github.com/djlint/djLint/issues/687
ignore = "H006,H030,H031,T002"

# ==== ruff ====
[tool.ruff]
target-version = "py314"
# Exclude a variety of commonly ignored directories.
extend-exclude = [ "*/migrations/*.py", "staticfiles/*" ]
lint.select = [
  "A",
  "ANN",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  "ANN002", # Annotation of function *args arguments
  "ANN003", # Annotation of function *kwargs arguments
  "COM812",
  "FBT001",
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "S101",   # Use of assert detected
  "SIM102", # sometimes it's better to nest
]
lint.per-file-ignores."test*.py" = [
  "ANN",
  "FBT003",
  "PLR2004",
  "PT009",
  "PT027",
  "S105",
  "S106",
  "SLF001",
]
lint.extend-unsafe-fixes = [ "UP038" ]
lint.isort.force-single-line = false

# ==== pyproject-fmt ====
[tool.pyproject-fmt]
keep_full_version = true

# ==== mypy ====
[tool.mypy]
ignore_missing_imports = true
python_version = "3.14"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = [ "mypy_django_plugin.main" ]
warn_unused_configs = true
overrides = [
  # Django migrations should not produce any errors:
  { module = "*.migrations.*", ignore_errors = true },
]

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ==== pytest ====
[tool.pytest]
addopts = [ "--ds=config.settings.test", "--reuse-db", "--import-mode=importlib" ]
DJANGO_SETTINGS_MODULE = "config.settings"
minversion = "9.0"
python_files = [ "tests.py", "test_*.py" ]
testpaths = [ "./tests", "idat" ]

[tool.coverage]
# ==== Coverage ====
run.include = [ "idat/**" ]
run.omit = [ "*/__pycache__/*", "*/migrations/*", "*/tests/*" ]
run.plugins = [ "django_coverage_plugin" ]
report.fail_under = 80
report.exclude_lines = [
  "if TYPE_CHECKING:",
  "pragma: no cover",
  "raise NotImplementedError",
]
report.skip_covered = true
report.show_missing = true

# ==== djangofmt ====
[tool.djangofmt]
profile = "django"
indent-width = 2
custom-blocks = [ "element", "slot" ]
html-void-self-closing = "always"
line-length = 119
