{% load i18n %}

<h1 class="type-headline-lg">
  {% translate "Almost there — check your answers before we generate the application" %}
</h1>

{# TODO: Maybe render meta-level issue hints as in the Figma mockups #}

<div class="flex flex-col gap-lg rounded-lg border border-default bg-surface p-lg">
  <h2 class="type-title-lg">{% translate "Your answers" %}</h2>
  {% include "dsa40_applications/_answers.html" with answers_form=form %}
</div>

<form
  hx-post="{% url 'dsa40_applications:wizard_step' 'review' %}"
  hx-target="#application-wizard-body"
  hx-swap="innerHTML"
>
  {% csrf_token %}
  <div class="flex justify-between gap-sm">
    <c-button
      variant="secondary"
      leading-icon="arrow-left"
      label="{% translate "Back" %}"
      hx-get="{% url 'dsa40_applications:wizard_step' 'enter-details' %}"
      hx-target="#application-wizard-body"
    />
    <c-button type="submit" icon="arrow-right" label="{% translate "Generate applications" %}" />
  </div>
</form>
