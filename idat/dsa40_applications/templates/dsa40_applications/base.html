{% extends "base.html" %}
{% load static %}

{% block javascript %}
  {# before main.js: module scripts are deferred and run in document order #}
  <script type="module" src="{% static 'dsa40_applications/wizard.js' %}"></script>
  {{ block.super }}
{% endblock javascript %}

{% block content %}
  <h1 class="font-bold text-xl">Create new DSA40 application</h1>

  <div id="application-wizard">
    <div
      id="application-wizard-body"
      hx-history="false"
      hx-get="{{ load_url }}"
      hx-trigger="load"
      hx-target="this"
    >
    </div>
  </div>
{% endblock content %}
