<form
  hx-post="{% url 'dsa40_applications:wizard_step' 2 %}"
  hx-target="#application-wizard-body"
  hx-swap="innerHTML"
>
  {% csrf_token %}
  {{ form }}
  <button
    type="button"
    hx-get="{% url 'dsa40_applications:wizard_step' 1 %}"
    hx-target="#application-wizard-body"
    class="btn btn-secondary"
  >
    Back
  </button>
  <button
    type="submit"
    class="btn btn-primary"
  >
    Review
  </button>
</form>
