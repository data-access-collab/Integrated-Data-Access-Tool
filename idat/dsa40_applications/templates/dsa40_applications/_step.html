<div
  id="application-wizard-indicator"
  class="border rounded-sm p-2 text-xs flex justify-between mt-3 mb-4"
>
  {% for n, label in steps %}
    <div class="{% if n == step %}font-bold{% endif %}">{{ label }}</div>
  {% endfor %}
</div>

<div>
  {% include step_template %}
</div>

<button
  type="button"
  x-data
  x-on:click="$dispatch('wizard-discard', { href: '{% url 'dsa40_applications:create' %}' })"
  class="mt-6 text-sm underline"
>
  Discard draft
</button>
