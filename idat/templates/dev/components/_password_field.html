<div class="flex max-w-120 flex-col gap-lg">
  <div class="flex flex-col gap-xs">
    <span class="type-overline text-tertiary">Default · show/hide toggle</span>
    <c-password-field
      name="pf_password_{{ theme }}"
      label="Password"
      required
      help-text="At least 15 characters."
      autocomplete="new-password"
    />
  </div>
  <div class="flex flex-col gap-xs">
    <span class="type-overline text-tertiary">Error · bound to a form field (form_errors.password)</span>
    <c-password-field :field="form_errors.password" />
  </div>
  <div class="flex flex-col gap-xs">
    <span class="type-overline text-tertiary">Disabled</span>
    <c-password-field name="pf_password_disabled_{{ theme }}" label="Password" disabled />
  </div>
</div>
