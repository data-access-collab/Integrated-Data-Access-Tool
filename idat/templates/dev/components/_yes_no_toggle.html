<div class="flex flex-col gap-md">
  <p class="type-body-sm text-tertiary">Click to select, Tab + arrow keys to move between Yes and No.</p>
  <div class="flex flex-wrap items-start gap-lg">
    <div class="flex flex-col items-start gap-xs">
      <span class="type-overline text-tertiary">Unset</span>
      <c-yes-no-toggle name="yn_unset_{{ theme }}" label="Example question" />
    </div>
    <div class="flex flex-col items-start gap-xs">
      <span class="type-overline text-tertiary">Yes</span>
      <c-yes-no-toggle name="yn_yes_{{ theme }}" label="Example question" value="yes" />
    </div>
    <div class="flex flex-col items-start gap-xs">
      <span class="type-overline text-tertiary">No</span>
      <c-yes-no-toggle name="yn_no_{{ theme }}" label="Example question" value="no" />
    </div>
  </div>
  <div class="flex flex-wrap items-start gap-lg">
    <div class="flex flex-col items-start gap-xs">
      <span class="type-overline text-tertiary">Bound field · initial No</span>
      <c-yes-no-toggle :field="form.is_affiliated" />
    </div>
    <div class="flex flex-col items-start gap-xs">
      <span class="type-overline text-tertiary">Bound field · error</span>
      <c-yes-no-toggle :field="form_errors.has_ethics_approval" />
    </div>
  </div>
  <div class="flex flex-col gap-xs">
    <span class="type-overline text-tertiary">Question row · c-field-layout inline (Figma 43:3962)</span>
    <c-field-layout
      input-id="yn_row_{{ theme }}"
      label="Does your research contribute to detecting or understanding systemic risks (Art. 34 DSA)?"
      required
      help-text="Required by all platforms for vetted-researcher access under Art. 40(4)."
      help-tip="systemic-risks"
      inline
    >
      <c-yes-no-toggle
        id="yn_row_{{ theme }}"
        name="yn_row_{{ theme }}"
        label="Does your research contribute to detecting or understanding systemic risks (Art. 34 DSA)?"
        value="yes"
      />
    </c-field-layout>
  </div>
  <div class="flex flex-col gap-xs">
    <span class="type-overline text-tertiary">Question row · bound field · error</span>
    <c-field-layout
      :field="form_errors.has_ethics_approval"
      :input-id="form_errors.has_ethics_approval.id_for_label"
      inline
    >
      <c-yes-no-toggle :field="form_errors.has_ethics_approval" hide-errors />
    </c-field-layout>
  </div>
</div>
