<div class="grid max-w-3xl gap-md sm:grid-cols-2">
  <div class="flex flex-col gap-xs">
    <span class="type-overline text-tertiary">Insight</span>
    <c-help.insight-card
      eyebrow="Community insight"
      body="8 of 11 researchers who named a concrete Art. 34 risk category here were granted access."
    />
  </div>
  <div class="flex flex-col gap-xs">
    <span class="type-overline text-tertiary">Info (Figma: Platform)</span>
    <c-help.insight-card
      tone="info"
      eyebrow="TikTok"
      body="Expects a research question of at least 1,500 characters including context."
    />
  </div>
  <div class="flex flex-col gap-xs">
    <span class="type-overline text-tertiary">Warning (body in the slot)</span>
    <c-help.insight-card tone="warning" eyebrow="Common rejection reason">
      Requests without a named Art. 34 risk category are usually declined.
    </c-help.insight-card>
  </div>
  <div class="flex flex-col gap-xs">
    <span class="type-overline text-tertiary">Danger (Figma: Review / Warning Item, Blocking)</span>
    <c-help.insight-card
      tone="danger"
      eyebrow="Deadline"
      body="Applications to this platform close on 31 March; later requests are declined."
    />
  </div>
  <div class="flex flex-col gap-xs">
    <span class="type-overline text-tertiary">Neutral (Figma: Not enough data colours)</span>
    <c-help.insight-card
      tone="neutral"
      eyebrow="Good to know"
      body="Some providers run several services; you can request data from each of them in one go."
    />
  </div>
</div>
