<div class="flex max-w-lg flex-col gap-md">
  <div class="flex flex-col gap-xs">
    <span class="type-overline text-tertiary">Empty</span>
    <div x-data="{ password1: '', password2: '' }">
      <c-forms.password-requirements min-length="15" />
    </div>
  </div>
  <div class="flex flex-col gap-xs">
    <span class="type-overline text-tertiary">Long enough, no match yet</span>
    <div x-data="{ password1: 'a-long-passphrase-1', password2: 'a-long' }">
      <c-forms.password-requirements min-length="15" />
    </div>
  </div>
  <div class="flex flex-col gap-xs">
    <span class="type-overline text-tertiary">Both met</span>
    <div x-data="{ password1: 'a-long-passphrase-1', password2: 'a-long-passphrase-1' }">
      <c-forms.password-requirements min-length="15" />
    </div>
  </div>
  <div class="flex flex-col gap-xs">
    <span class="type-overline text-tertiary">Interactive</span>
    <div class="flex flex-col gap-md" x-data="{ password1: '', password2: '' }">
      <c-password-field name="demo_password1" label="New password" x-model="password1" />
      <c-password-field name="demo_password2" label="Repeat new password" x-model="password2" />
      <c-forms.password-requirements min-length="15" />
    </div>
  </div>
</div>
