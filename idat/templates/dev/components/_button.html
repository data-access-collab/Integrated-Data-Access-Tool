<div class="flex flex-col gap-md">
  <p class="type-body-sm text-tertiary">Hover with the mouse, Tab through to see the focus ring.</p>
  <div class="flex flex-col gap-sm">
    <span class="type-overline text-tertiary">Primary</span>
    <div class="flex flex-wrap items-center gap-sm">
      <c-button label="Continue" icon="arrow-right" />
      <c-button label="Continue" icon="arrow-right" disabled />
    </div>
    <span class="type-overline text-tertiary">Brand</span>
    <div class="flex flex-wrap items-center gap-sm">
      <c-button variant="brand" label="Continue" icon="arrow-right" />
      <c-button variant="brand" label="Continue" icon="arrow-right" disabled />
    </div>
    <span class="type-overline text-tertiary">Secondary</span>
    <div class="flex flex-wrap items-center gap-sm">
      <c-button variant="secondary" label="Continue" icon="arrow-right" />
      <c-button variant="secondary" label="Continue" icon="arrow-right" disabled />
    </div>
    <span class="type-overline text-tertiary">Ghost</span>
    <div class="flex flex-wrap items-center gap-sm">
      <c-button variant="ghost" label="Continue" icon="arrow-right" />
      <c-button variant="ghost" label="Continue" icon="arrow-right" disabled />
    </div>
    <span class="type-overline text-tertiary">Danger (dialog confirm)</span>
    <div class="flex flex-wrap items-center gap-sm">
      <c-button variant="danger" label="Withdraw from Meta" />
      <c-button variant="danger" label="Withdraw from Meta" disabled />
    </div>
    <span class="type-overline text-tertiary">Icons</span>
    <div class="flex flex-wrap items-center gap-sm">
      <c-button label="Submit" />
      <c-button variant="secondary" label="Save draft" leading-icon="save" />
      <c-button variant="ghost" label="Why are we doing this?" leading-icon="help-circle" />
      <c-button variant="brand" label="Download" leading-icon="download" icon="arrow-right" />
    </div>
    <span class="type-overline text-tertiary">As link</span>
    <div class="flex flex-wrap items-center gap-sm">
      <c-button variant="brand" label="Go home" href="/" icon="arrow-right" />
      <c-button variant="ghost" label="Go home" href="/" />
    </div>
  </div>
</div>
