<div class="flex flex-col gap-md">
  <div class="flex flex-col gap-xs">
    <span class="type-overline text-tertiary">Tone · with dot</span>
    <div class="flex flex-wrap items-center gap-sm">
      <c-badge tone="success" label="Complete" />
      <c-badge tone="warning" label="Complete" />
      <c-badge tone="danger" label="Complete" />
      <c-badge tone="info" label="Complete" />
      <c-badge tone="neutral" label="Complete" />
      <c-badge tone="accent" label="Complete" />
    </div>
  </div>
  <div class="flex flex-col gap-xs">
    <span class="type-overline text-tertiary">Tone · without dot</span>
    <div class="flex flex-wrap items-center gap-sm">
      <c-badge tone="success" label="Complete" :dot="False" />
      <c-badge tone="warning" label="Complete" :dot="False" />
      <c-badge tone="danger" label="Complete" :dot="False" />
      <c-badge tone="info" label="Complete" :dot="False" />
      <c-badge tone="neutral" label="Complete" :dot="False" />
      <c-badge tone="accent" label="Complete" :dot="False" />
    </div>
  </div>
</div>
