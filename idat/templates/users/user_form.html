{% extends "base.html" %}

{% load i18n %}

{% block title %}
  {{ user.username }}
{% endblock title %}
{% block content %}
  <h1 class="type-headline-lg">{{ user.username }}</h1>
  <form class="flex max-w-xl flex-col gap-lg" method="post" action="{% url 'users:update' %}">
    {% csrf_token %}
    {{ form }}
    <div class="flex justify-end">
      <c-button type="submit" label="{% translate "Update" %}" />
    </div>
  </form>
{% endblock content %}
