{% load i18n %}

<c-top-bar initials="{{ user.initials }}" account-href="{% url 'users:detail' %}">
  <c-slot name="nav">
    <a
      class="rounded-sm type-label-lg text-secondary hover:text-primary"
      href="#top-bar"
    >{% translate "How it works" %}</a>
    <a
      class="rounded-sm type-label-lg text-secondary hover:text-primary"
      href="#top-bar"
    >{% translate "Community" %}</a>
  </c-slot>
  <c-slot name="actions">
    <c-button variant="ghost" label="{% translate 'Why are we doing this?' %}" />
    {% if not user.is_authenticated %}
      <c-button variant="secondary" label="{% translate 'Sign in' %}" href="{% url 'account_login' %}" />
    {% endif %}
  </c-slot>
</c-top-bar>
