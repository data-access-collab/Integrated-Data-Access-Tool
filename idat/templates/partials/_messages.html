{% load i18n %}
{% if messages %}
  <div class="flex flex-col gap-2 my-4">
    {% for message in messages %}
      <div
        role="alert"
        class="
          flex items-start justify-between gap-4 rounded border px-4 py-3
          {% if message.level_tag == 'success' %}bg-success
          {% elif message.level_tag == 'warning' %}bg-warning
          {% elif message.level_tag == 'error' %}bg-danger
          {% else %}bg-blue-500{% endif %}
        "
      >
        <span>{{ message }}</span>
        <button
          type="button"
          data-dismiss-alert
          class="shrink-0 leading-none opacity-60 hover:opacity-100"
          aria-label="Close"
        >
          &times<span aria-hidden="true">×</span>
        </button>
      </div>
    {% endfor %}
  </div>
{% endif %}
