{% load allauth %}

{% if attrs.type == "textarea" %}
  <div class="mb-4">
    <div class="sm:w-5/6">
      <label for="{{ attrs.id }}">
        {% slot label %} {% endslot %}
      </label>
    </div>
    <textarea
      {% if attrs.required %}required{% endif %}
      {% if attrs.rows %}rows="{{ attrs.rows }}"{% endif %}
      {% if attrs.disabled %}disabled{% endif %}
      {% if attrs.readonly %}readonly{% endif %}
      {% if attrs.checked %}checked{% endif %}
      {% if attrs.name %}name="{{ attrs.name }}"{% endif %}
      {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
      {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"{% endif %}
    >{% slot value %}{% endslot %}</textarea>
  </div>
{% elif attrs.type == "radio" %}
  <div class="mb-4">
    <div class="sm:w-5/6">
      <div class="flex items-center gap-2">
        <input
          {% if attrs.required %}required{% endif %}
          {% if attrs.disabled %}disabled{% endif %}
          {% if attrs.readonly %}readonly{% endif %}
          {% if attrs.checked %}checked{% endif %}
          {% if attrs.name %}name="{{ attrs.name }}"{% endif %}
          {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
          {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"{% endif %}
          {% if attrs.autocomplete %}autocomplete="{{ attrs.autocomplete }}"{% endif %}
          value="{{ attrs.value|default_if_none:"" }}"
          type="{{ attrs.type }}"
        />
        <label class="cursor-pointer peer-disabled:cursor-default peer-disabled:opacity-50" for="{{ attrs.id }}">
          {% slot label %} {% endslot %}
        </label>
      </div>
    </div>
  </div>
{% else %}
  <div class="sm:w-5/6">
    <label for="{{ attrs.id }}">
      {% slot label %} {% endslot %}
    </label>
  </div>
  <div class="sm:w-5/6">
    <input
      {% if attrs.required %}required{% endif %}
      {% if attrs.disabled %}disabled{% endif %}
      {% if attrs.readonly %}readonly{% endif %}
      {% if attrs.checked %}checked{% endif %}
      {% if attrs.name %}name="{{ attrs.name }}"{% endif %}
      {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
      {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"{% endif %}
      {% if attrs.autocomplete %}autocomplete="{{ attrs.autocomplete }}"{% endif %}
      value="{{ attrs.value|default_if_none:"" }}"
      type="{{ attrs.type }}"
    />
  </div>
{% endif %}
{% if slots.help_text %}
  <div class="mt-1 text-sm text-gray-500">
    {% slot help_text %} {% endslot %}
  </div>
{% endif %}
