{% load allauth %}

<span
  class="
    inline-flex items-center rounded-md px-2 py-0.5 text-xs font-semibold
    {% if 'success' in attrs.tags %} bg-success{% endif %}
    {% if 'warning' in attrs.tags %} bg-warning{% endif %}
    {% if 'secondary' in attrs.tags %} bg-secondary{% endif %}
    {% if 'danger' in attrs.tags %} bg-danger{% endif %}
    {% if 'primary' in attrs.tags %} bg-primary{% endif %}
  "
>
  {% slot %}{% endslot %}
</span>
