{% load allauth %}

<section>
  <div class="mb-6 rounded-md border border-gray-200 bg-surface p-4">
    <h2 class="mb-2 text-xl font-semibold">
      {% slot title %} {% endslot %}
    </h2>
    {% slot body %}
    {% endslot %}
    {% if slots.actions %}
      <ul>
        {% for action in slots.actions %}<li>{{ action }}</li>{% endfor %}
      </ul>
    {% endif %}
  </div>
</section>
