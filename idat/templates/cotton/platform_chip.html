{% comment %}
  Props:
    name     platform name, e.g. "TikTok"
    initial  letter in the circle; defaults to the first letter of name

  Usage:
    <c-platform-chip name="TikTok" />
    <c-platform-chip name="X (Twitter)" initial="X" />
{% endcomment %}

<c-vars name="" initial="" class="" />
<span
  class="inline-flex items-center gap-1.5 whitespace-nowrap rounded-full border border-default bg-surface py-0.75 pl-1 pr-2.5 type-label-md text-secondary {{ class }}"
  {{ attrs }}
>
  <span
    class="inline-flex size-4.5 shrink-0 items-center justify-center overflow-hidden rounded-full bg-brand text-on-brand"
    aria-hidden="true"
  >{{ initial|default:name|slice:":1" }}</span>
  {{ name }}
</span>
