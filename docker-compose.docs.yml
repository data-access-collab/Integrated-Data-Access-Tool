services:
  docs:
    image: idat_local_docs
    container_name: idat_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    volumes:
      - ./zensical.toml:/app/zensical.toml:z
      - ./docs:/app/docs:z
      - ./idat:/app/idat:z
    ports:
      - '9000:9000'
    command: /start-docs
