# Zensical configuration — https://zensical.org/docs/setup/basics/
# Serve: `just docs` (or `docker compose -f docker-compose.docs.yml up`)
# Build: `just docs-build` → site/

[project]
site_name = "Integrated Data Access Tool Documentation"
site_author = "DSA40 Data Access Collaboratory"
copyright = "Copyright &copy; 2026 DSA40 Data Access Collaboratory"
docs_dir = "docs"
site_dir = "site"
nav = [
  { "Home" = "index.md" },
  { "Dev Setup" = [
    "setup/index.md",
    { "Local development" = "setup/local.md" },
    { "Frontend assets" = "setup/frontend-assets.md" },
    { "Testing & quality" = "setup/testing.md" },
    { "Deployment" = "setup/deployment.md" },
  ] },
  { "Contributing" = [
    "contributing/index.md",
    { "UI Library" = "contributing/ui-library.md" },
    { "Figma sync" = "contributing/figma-sync.md" },
    { "Docs" = "contributing/docs.md" },
  ] },
  { "Apps" = [
    "apps/index.md",
    { "Core" = "apps/core.md" },
    { "Users" = "apps/users.md" },
    { "VLOPSE" = "apps/vlopse.md" },
    { "Form handler" = "apps/form-handler.md" },
  ] },
  { "Reference" = [
    "reference/index.md",
    { "REST API" = "reference/api.md" },
    { "Settings & environment" = "reference/settings.md" },
    { "Models" = [
      { "Users" = "reference/code/users.md" },
      { "VLOPSE" = "reference/code/vlopse.md" },
      { "Form handler" = "reference/code/form-handler.md" },
    ] },
  ] },
]
# App colours (dark/light) mapped onto the theme; see the file's header comment.
extra_css = ["stylesheets/theme.css"]

[project.extra]
generator = false  # no "Made with Zensical" in the footer

[project.theme]
language = "en"
logo = "assets/dsa40_logo.svg"
favicon = "assets/favicon.svg"  # app favicon, recoloured white
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",  # section names open their index.md
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",     # top-level sections as header tabs
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
toc.toc_depth = 3
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = false
members_order = "source"
show_if_no_docstring = true  # most code has no docstrings yet; still list signatures
